name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # tsc/eslint/vitest don't need the Electron binary
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc
      - run: npx eslint . --max-warnings 0
      - run: npm test

  # The renderer behaves differently when loaded from disk under the strict
  # CSP than it does behind the Vite dev server, and nothing else covers that.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Chromium refuses to start rather than drop its sandbox, and npm cannot
      # set the setuid bit on extraction. Keep the sandbox on (rather than
      # passing --no-sandbox) so CI runs the same way a user's machine does.
      - name: Fix permissions on Electron's sandbox helper
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - run: npx tsc && npx vite build
      # Electron needs a display even though nothing looks at the window.
      - run: xvfb-run -a npm run test:smoke
