name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc && npx vite build
      - run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      # Smoke-test the bundle we are about to publish, in its shipped
      # configuration (file:// + production CSP + asar). npm test and the e2e
      # only ever exercise the dev server, which differs in ways that have
      # shipped bugs before.
      - name: Smoke-test the built app
        run: npm run test:smoke -- --app "$(ls -d release/*/mac-*/photo-slap.app | head -1)"
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            release/*/photo-slap-Mac-*-Installer.dmg
            release/*/photo-slap-Mac-*-Installer.dmg.blockmap
          generate_release_notes: true
          body: |
            > [!IMPORTANT]
            > This build is unsigned, so macOS will claim the app is *"damaged and can't be opened."*
            > After dragging photo-slap.app to Applications, clear the quarantine flag:
            > ```
            > xattr -dr com.apple.quarantine /Applications/photo-slap.app
            > ```
            > The flag returns on every upgrade, since each install stages a fresh copy.
